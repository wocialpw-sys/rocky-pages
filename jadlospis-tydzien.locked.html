<title>Jadłospis tygodnia</title>
<style>

 .box{background:#fff;border:1px solid #eceef1;border-radius:16px;padding:30px 28px;max-width:380px;width:92%;text-align:center;box-shadow:0 4px 24px rgba(20,30,45,.06)}

 button{width:100%;padding:12px;border:0;border-radius:10px;background:#3D7A46;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
 .err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
</style></head>

function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){
  const blob=b64d(PAYLOAD);
  const salt=blob.slice(0,16), iv=blob.slice(16,28), data=blob.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(pt);
}
async function go(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent='Błędne hasło.'; }
}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
